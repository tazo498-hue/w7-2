<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORD QUEST 3.0 | Spaced Magic Adventure</title>
<style>
:root{
 --ink:#39315f;--purple:#8558ed;--pink:#ff70b5;
 --mint:#24bd96;--yellow:#ffd75a
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:var(--ink);
 font-family:"Trebuchet MS","Malgun Gothic",sans-serif;
 background:
 radial-gradient(circle at 10% 10%,#fff0a3,transparent 25%),
 radial-gradient(circle at 90% 15%,#ffc7e8,transparent 28%),
 linear-gradient(135deg,#ffe1f2,#e0ddff 55%,#c8f7ee)
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #ffbf35;outline-offset:3px}
button:disabled{cursor:default;opacity:.65}
.app{max-width:860px;margin:auto;padding:18px 14px 50px}
.top{
 display:flex;justify-content:space-between;align-items:center;
 flex-wrap:wrap;gap:10px;margin-bottom:15px
}
.logo{font-size:25px;font-weight:1000;color:#7444d8;text-shadow:2px 2px white}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.pill{
 background:white;border:2px solid #ece0ff;border-radius:25px;
 padding:9px 12px;font-size:14px;font-weight:900;
 box-shadow:0 4px #d8c8f5
}
.track{height:17px;background:white;border-radius:30px;padding:3px;margin-bottom:22px}
.fill{
 height:100%;width:0;border-radius:30px;
 background:linear-gradient(90deg,#55dcb2,#74baff,#a685ff);
 transition:width .3s
}
.panel{
 background:white;border:4px solid white;border-radius:30px;
 padding:26px;box-shadow:0 12px #d3c2ed,0 20px 35px #48388a20
}
.center{text-align:center}
h1{font-size:clamp(29px,6vw,46px);margin:12px 0}
h2{font-size:clamp(23px,5vw,31px);margin:12px 0}
p{line-height:1.65}
.tag{
 display:inline-block;background:#efe7ff;color:#7750d2;
 border-radius:30px;padding:9px 15px;font-size:13px;font-weight:900
}
.subtitle{font-size:16px;color:#776a95;font-weight:800}
.mascot{font-size:90px;margin:16px 0;animation:float 2.7s infinite}
@keyframes float{50%{transform:translateY(-9px) rotate(3deg)}}
.btn{
 border:0;background:var(--purple);color:white;
 border-radius:18px;padding:13px 19px;min-height:48px;
 font-weight:900;font-size:16px;box-shadow:0 5px #5a35ae;
 margin:4px
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px #5a35ae}
.btn.pink{background:var(--pink);box-shadow:0 5px #ca408b}
.btn.mint{background:var(--mint);box-shadow:0 5px #087d65}
.btn.light{background:#f0e8ff;color:#7550bf;box-shadow:0 5px #d7c8f9}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:23px 0}
.world{
 background:#faf7ff;border:3px solid #eaddff;border-radius:22px;
 padding:16px 8px;text-align:center
}
.world .emoji{font-size:42px}
.world strong{display:block;margin:8px 0}
.world small{font-weight:800;color:#887c9d}
.world.done{background:#e8fff4;border-color:#71dcb8}
.world.active{background:#f0e8ff;border-color:#aa87f5}
.scene{
 min-height:185px;margin:20px 0;border-radius:26px;
 background:linear-gradient(135deg,#fff0af,#ffd2e7,#d9d0ff);
 display:flex;align-items:center;justify-content:center;
 border:3px solid #f1e4ff;position:relative
}
.scene:before,.scene:after{
 content:"✦";position:absolute;top:15px;left:28px;
 font-size:35px;color:white
}
.scene:after{top:auto;left:auto;right:28px;bottom:15px}
.art{font-size:clamp(65px,13vw,105px);animation:float 2.7s infinite}
.speech{
 background:#f5efff;border:2px solid #e6d8ff;
 border-radius:20px;padding:19px;text-align:center;
 font-size:clamp(17px,3vw,22px);font-weight:900;line-height:1.7
}
.context{
 background:#fff5d8;border-radius:17px;
 padding:13px 15px;margin:17px 0;
 color:#795c27;font-size:14px;font-weight:800
}
.question{font-size:19px;font-weight:1000;margin:22px 0 15px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
 background:white;border:3px solid #e9defb;border-radius:21px;
 min-height:115px;padding:14px 9px;
 color:var(--ink);font-size:15px;font-weight:900;
 box-shadow:0 5px #e9defb
}
.choice:hover:not(:disabled){background:#f8f3ff}
.choice .emoji{display:block;font-size:38px;margin-bottom:9px}
.choice.good{background:#e2fff1;border-color:#45cb9a;box-shadow:0 5px #28a779}
.choice.bad{background:#ffe8f0;border-color:#ff91b1;box-shadow:0 5px #e77597}
.feedback{
 background:#e8fff4;border:2px solid #84dfb4;
 border-radius:19px;padding:16px;margin-top:18px;
 font-weight:800;line-height:1.65
}
.feedback.error{background:#fff0f4;border-color:#ffb0c8}
.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}
.controls .btn{font-size:14px;padding:10px 13px}
.timeline{display:grid;gap:12px;margin:22px 0}
.timecard{
 background:#faf7ff;border:3px solid #e9dffc;
 border-radius:20px;padding:17px
}
.timecard.open{background:#eafff5;border-color:#52d4aa}
.timecard.done{background:#edf6ff;border-color:#9ac4ff}
.timecard strong{display:block;margin-bottom:7px}
.timecard small{color:#776a96;font-weight:800}
.notice{
 background:#f0f8ff;border-radius:17px;
 padding:15px;margin:17px 0;font-size:14px;line-height:1.7
}
.reward{font-size:80px;margin:20px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0}
.chip{
 background:#efe8ff;color:#7550c5;border-radius:25px;
 padding:9px 13px;font-size:14px;font-weight:900
}
.footer{text-align:center;margin-top:27px;font-size:13px;color:#897e9e;font-weight:800}
@media(max-width:520px){
 .panel{padding:19px 13px}
 .top{justify-content:center}
 .world strong{font-size:14px}
 .choices{gap:8px}
 .choice{font-size:14px;min-height:107px;padding:12px 7px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

const words=raw.map(r=>({
 word:r[0],
 world:r[1],
 scenes:r[2].map(s=>({
  art:s[0],line:s[1],clue:s[2],
  correct:s[3],wrong:s[4]
 }))
}));

/* 챕터별 새 어휘 + 이전 어휘의 교차 재등장 */
const journey=[];
const repeats=[
 [],
 [0,5,2,7],
 [10,3,6,12,1,9],
 [15,11,4,17,8,13,16,14,18,19]
];

for(let chapter=0;chapter<4;chapter++){
 for(let i=chapter*5;i<chapter*5+5;i++){
  journey.push({kind:"first",index:i,scene:0});
 }
 repeats[chapter].forEach(i=>{
  journey.push({kind:"repeat",index:i,scene:1});
 });
 journey.push({kind:"checkpoint",chapter});
}

/* 복습에서는 챕터 순서가 아닌 교차 순서를 사용 */
const orders=[
 [0,10,5,15,2,12,7,17,4,14,9,19,1,11,6,16,3,13,8,18],
 [13,3,18,8,10,0,15,5,12,2,17,7,14,4,19,9,11,1,16,6],
 [6,16,1,11,9,19,4,14,7,17,2,12,5,15,0,10,8,18,3,13],
 [18,8,13,3,16,6,11,1,19,9,14,4,17,7,12,2,15,5,10,0]
];

const schedule=[
 {day:1,title:"DAY 1",icon:"🌤️",desc:"다음 날의 마법 미션"},
 {day:3,title:"DAY 3",icon:"🌙",desc:"3일 뒤의 비밀 탐험"},
 {day:7,title:"DAY 7",icon:"🌈",desc:"7일 뒤 최종 보물찾기"}
];

const KEY="wordquest3_spaced_complete";

function fresh(){
 return {
  cursor:0,firstCount:0,stars:0,gems:0,mistakes:0,
  completedAt:null,
  review:{cursor:0,score:0,completed:false},
  delayed:Array.from({length:3},()=>({
   cursor:0,score:0,completed:false
  }))
 };
}

function load(){
 try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(!s||!Number.isInteger(s.cursor))return fresh();
  const d=fresh();
  return {
   ...d,...s,
   cursor:Math.max(0,Math.min(journey.length,s.cursor)),
   firstCount:Math.max(0,Math.min(20,s.firstCount||0)),
   review:{...d.review,...(s.review||{})},
   delayed:d.delayed.map((x,i)=>({
    ...x,...((s.delayed||[])[i]||{})
   }))
  };
 }catch(e){return fresh()}
}

let state=load();
let mode="home";
let task=null;
let solved=false;
let attempts=0;
let activeDelayed=-1;
let optionOrder=[0,1];

const screen=document.getElementById("screen");

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state))}
 catch(e){}
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function render(html){
 screen.innerHTML='<div class="panel">'+html+'</div>';
 document.getElementById("stars").textContent="⭐ "+state.stars;
 document.getElementById("gems").textContent="💎 "+state.gems;
 document.getElementById("count").textContent=
  "🗺️ "+state.firstCount+"/20";
 document.getElementById("bar").style.width=
  (state.firstCount/20*100)+"%";
 window.scrollTo({top:0,behavior:"smooth"});
}

function stopVoice(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
}

function speak(line){
 if(!("speechSynthesis" in window)){
  alert("이 브라우저는 영어 음성을 지원하지 않아요.");
  return;
 }
 stopVoice();
 const u=new SpeechSynthesisUtterance(line);
 u.lang="en-US";
 u.rate=.82;
 u.pitch=1.06;
 const v=speechSynthesis.getVoices();
 u.voice=v.find(x=>x.lang==="en-US")||
         v.find(x=>x.lang.startsWith("en"))||null;
 speechSynthesis.speak(u);
}

function daysPassed(){
 if(!state.completedAt)return 0;
 const a=new Date();
 const b=new Date(state.completedAt);
 const today=Date.UTC(a.getFullYear(),a.getMonth(),a.getDate());
 const start=Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());
 return Math.max(0,Math.floor((today-start)/86400000));
}

function daysUntil(day){
 return Math.max(0,day-daysPassed());
}

function home(){
 stopVoice();
 mode="home";

 const cards=worlds.map((w,i)=>{
  const done=state.firstCount>=(i+1)*5;
  const active=!done&&state.firstCount>=i*5;
  return `
   <div class="world ${done?"done":active?"active":""}">
    <div class="emoji">${w.icon}</div>
    <strong>LEVEL ${i+1}<br>${w.name}</strong>
    <small>${done?"✅ CLEAR":active?"🎯 PLAY NOW":"🔒 LOCKED"}</small>
   </div>`;
 }).join("");

 render(`
  <div class="center">
   <div class="tag">SPACED MAGIC ADVENTURE</div>
   <div class="mascot">🦄🏰🌈</div>
   <h1>WORD QUEST 3.0!</h1>
   <div class="subtitle">마법 학교 대탈출</div>
   <p>
    영어를 듣고 읽으며 마법 세계를 탐험해 봐!<br>
    알맞은 행동을 선택하면 다음 문이 열려.<br>
    전에 만났던 단어가 새로운 장면에 또 나타날 거야.
   </p>
  </div>
  <div class="worlds">${cards}</div>
  <div class="center">
   <button class="btn pink" onclick="continueJourney()">
    ${state.completedAt?"🏆 탐험 결과 보기":
      state.cursor?"🚀 모험 이어하기":"🚀 모험 시작!"}
   </button>
   <button class="btn light" onclick="resetGame()">🔄 초기화</button>
  </div>
  ${state.completedAt?`
   <div class="notice">
    📅 첫 탐험 완료:
    ${new Date(state.completedAt).toLocaleDateString("ko-KR")}<br>
    복습 마법 시계가 열렸어요!
   </div>
   <div class="center">
    <button class="btn mint" onclick="reviewHub()">
     🕒 분산 복습 마법 시계
    </button>
   </div>`:""}
 `);
}

function continueJourney(){
 if(state.completedAt)return adventureComplete();
 nextJourney();
}

function nextJourney(){
 if(state.cursor>=journey.length){
  finishJourney();
  return;
 }
 const step=journey[state.cursor];
 if(step.kind==="checkpoint"){
  checkpoint(step.chapter);
  return;
 }
 task={
  source:"journey",
  index:step.index,
  scene:step.scene,
  kind:step.kind
 };
 showTask();
}

function showTask(){
 stopVoice();
 mode="task";
 solved=false;
 attempts=0;

 const w=words[task.index];
 const s=w.scenes[task.scene];
 let heading="";
 let count="";

 if(task.source==="journey"){
  heading=task.kind==="first"?
   "✨ 새로운 마법 미션":"🔮 다시 만난 마법 미션";
  count=`${state.cursor+1}/${journey.length}`;
 }else if(task.source==="review"){
  heading="🎲 DAY 0 종합 모험";
  count=`${state.review.cursor+1}/20`;
 }else{
  heading="🕒 "+schedule[activeDelayed].title+" 복귀 퀘스트";
  count=`${state.delayed[activeDelayed].cursor+1}/20`;
 }

 optionOrder=Math.random()<.5?[0,1]:[1,0];
 const options=[s.correct,s.wrong];

 const buttons=optionOrder.map((n,i)=>`
  <button class="choice" id="choice${i}" onclick="pick(${i})">
   <span class="emoji">${options[n][0]}</span>
   ${esc(options[n][1])}
  </button>
 `).join("");

 render(`
  <div class="center">
   <div class="tag">${heading} · ${count}</div>
   <h2>${worlds[w.world].icon} ${worlds[w.world].name}</h2>
   <p class="subtitle">영어 속 단서를 찾아 행동해 봐!</p>
  </div>
  <div class="scene"><div class="art">${s.art}</div></div>
  <div class="speech">${esc(s.line)}</div>
  <div class="center">
   <button class="btn light" onclick="readTask()">🔊 영어 듣기</button>
  </div>
  <div class="context">💬 상황 단서: ${esc(s.clue)}</div>
  <div class="question">🎯 What will you do?</div>
  <div class="choices">${buttons}</div>
  <div id="feedback"></div>
  <div class="controls">
   <button class="btn light" onclick="hint()">💡 힌트</button>
   <button class="btn light" onclick="home()">🏠 월드맵</button>
  </div>
 `);
}

function readTask(){
 if(task)speak(words[task.index].scenes[task.scene].line);
}

function hint(){
 if(!task||solved)return;
 const s=words[task.index].scenes[task.scene];
 document.getElementById("feedback").innerHTML=`
  <div class="feedback">
   💡 그림과 문장 속 상황을 다시 살펴봐!<br>
   ${esc(s.clue)}
  </div>`;
}

function pick(i){
 if(mode!=="task"||solved||!task)return;
 const s=words[task.index].scenes[task.scene];
 const box=document.getElementById("feedback");

 if(optionOrder[i]!==0){
  attempts++;
  state.mistakes++;
  save();
  const b=document.getElementById("choice"+i);
  b.classList.add("bad");
  b.disabled=true;
  box.innerHTML=`
   <div class="feedback error">
    🌈 다른 행동을 골라 보자!<br>
    문장을 다시 들어 보면 단서가 보일 거야.
    <div style="margin-top:10px">
     <button class="btn light" onclick="readTask()">🔊 다시 듣기</button>
    </div>
   </div>`;
  return;
 }

 solved=true;
 document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 document.getElementById("choice"+i).classList.add("good");

 const earned=attempts===0?3:1;
 state.stars+=earned;
 state.gems++;

 if(task.source==="journey"){
  if(task.kind==="first")state.firstCount++;
  state.cursor++;
 }else if(task.source==="review"){
  if(attempts===0)state.review.score++;
  state.review.cursor++;
 }else{
  const d=state.delayed[activeDelayed];
  if(attempts===0)d.score++;
  d.cursor++;
 }

 save();

 box.innerHTML=`
  <div class="feedback">
   🎉 GREAT JOB! ⭐ +${earned} · 💎 +1<br>
   ${esc(s.line)}
   <div style="margin-top:12px">
    <button class="btn mint" onclick="nextTask()">
     ➡️ 다음 모험
    </button>
   </div>
  </div>`;

 speak(s.line);

 document.getElementById("stars").textContent="⭐ "+state.stars;
 document.getElementById("gems").textContent="💎 "+state.gems;
 document.getElementById("count").textContent="🗺️ "+state.firstCount+"/20";
 document.getElementById("bar").style.width=
  (state.firstCount/20*100)+"%";
}

function nextTask(){
 if(!solved)return;
 if(task.source==="journey")nextJourney();
 else if(task.source==="review")nextReview();
 else nextDelayed();
}

function checkpoint(chapter){
 mode="checkpoint";
 render(`
  <div class="center">
   <div class="tag">LEVEL ${chapter+1} CLEAR!</div>
   <div class="reward">${worlds[chapter].icon}🏆✨</div>
   <h1>CHAPTER CLEAR!</h1>
   <h2>${worlds[chapter].name} 성공!</h2>
   <p class="subtitle">
    이야기 속 행동을 선택하며<br>
    ${state.firstCount}개의 새로운 단어를 만났어!
   </p>
   <button class="btn pink" onclick="leaveCheckpoint()">
    ${chapter===3?"🏆 탐험 완료!":"🚀 다음 세계로!"}
   </button>
  </div>`);
}

function leaveCheckpoint(){
 if(mode!=="checkpoint")return;
 state.cursor++;
 save();
 nextJourney();
}

function finishJourney(){
 if(!state.completedAt)state.completedAt=Date.now();
 state.cursor=journey.length;
 save();
 adventureComplete();
}

function adventureComplete(){
 mode="complete";
 const chips=words.map(w=>`<span class="chip">${w.word}</span>`).join("");
 render(`
  <div class="center">
   <div class="tag">ALL WORLDS COMPLETE!</div>
   <div class="reward">🏆👑🌈</div>
   <h1>YOU DID IT!</h1>
   <h2>마법 학교 대탈출 성공!</h2>
   <p class="subtitle">
    20개 단어를 여러 이야기에서 만났어!<br>
    이제 새로운 문맥에서 다시 모험할 차례야.
   </p>
   <div class="chips">${chips}</div>
   <p>⭐ ${state.stars} · 💎 ${state.gems}</p>
   <div class="notice">
    🕒 오늘의 종합 모험을 완료하고<br>
    다음 날, 3일 뒤, 7일 뒤에 다시 만나자!
   </div>
   <button class="btn pink" onclick="reviewHub()">
    🕒 분산 복습 시작
   </button>
   <button class="btn light" onclick="home()">🏠 월드맵</button>
  </div>`);
}

/* DAY 0 종합 모험 */
function startReview(){
 if(!state.completedAt)return;
 nextReview();
}

function nextReview(){
 if(state.review.cursor>=20){
  finishReview();
  return;
 }
 const i=orders[0][state.review.cursor];
 task={source:"review",index:i,scene:1};
 showTask();
}

function finishReview(){
 state.review.completed=true;
 save();
 mode="reviewResult";
 render(`
  <div class="center">
   <div class="tag">DAY 0 REVIEW CLEAR!</div>
   <div class="reward">🎲🌟🎉</div>
   <h1>MAGIC REVIEW!</h1>
   <h2>${state.review.score}/20</h2>
   <p class="subtitle">
    첫 시도에 성공한 미션: ${state.review.score}개<br>
    틀린 미션도 다시 도전해서 모두 완료했어!
   </p>
   <div class="notice">
    🌤️ 다음 날 다시 돌아오면<br>
    새로운 장면에서 영어 단어를 만나게 돼.
   </div>
   <button class="btn pink" onclick="reviewHub()">
    🕒 마법 시계 보기
   </button>
  </div>`);
}

/* DAY 1, 3, 7 복귀 퀘스트 */
function startDelayed(i){
 if(!state.completedAt||!state.review.completed)return;
 if(i<0||i>2)return;
 if(daysUntil(schedule[i].day)>0)return;

 // 이전 복귀 퀘스트를 완료해야 다음 단계 시작
 if(i>0&&!state.delayed[i-1].completed)return;

 activeDelayed=i;
 nextDelayed();
}

function nextDelayed(){
 if(activeDelayed<0)return;

 const d=state.delayed[activeDelayed];

 if(d.cursor>=20){
  finishDelayed();
  return;
 }

 const i=orders[activeDelayed+1][d.cursor];

 /*
  첫 복귀는 두 번째 장면,
  다음 복귀는 세 번째 장면,
  마지막 복귀는 첫 번째와 세 번째 장면을
  번갈아 제시한다.
 */
 let scene=activeDelayed===0?1:
           activeDelayed===1?2:
           d.cursor%2===0?2:0;

 task={source:"delayed",index:i,scene};
 showTask();
}

function finishDelayed(){
 const d=state.delayed[activeDelayed];
 d.completed=true;
 save();

 const title=schedule[activeDelayed].title;
 const isLast=activeDelayed===2;

 mode="delayedResult";

 render(`
  <div class="center">
   <div class="tag">${title} COMPLETE!</div>
   <div class="reward">${isLast?"👑🏆🌈":"🌟🎁✨"}</div>
   <h1>${isLast?"MASTER WIZARD!":"QUEST CLEAR!"}</h1>
   <h2>${d.score}/20</h2>
   <p class="subtitle">
    첫 시도 성공 ${d.score}개!<br>
    20개의 미션을 모두 해결했어.
   </p>
   <div class="notice">
    ${isLast?
     "🎓 Day 0, Day 1, Day 3, Day 7의 모든 복귀 퀘스트를 완료했어!":
     "🕒 다음 복귀 퀘스트에서도 새로운 장면이 기다리고 있어!"}
   </div>
   <button class="btn pink" onclick="reviewHub()">
    🕒 마법 시계로 돌아가기
   </button>
  </div>`);
}

function reviewHub(){
 if(!state.completedAt){
  home();
  return;
 }

 stopVoice();
 mode="hub";

 const day0=`
  <div class="timecard ${state.review.completed?"done":"open"}">
   <strong>🎲 DAY 0 · 종합 모험</strong>
   <small>
    ${state.review.completed?
      "완료 · 첫 시도 성공 "+state.review.score+"/20":
      "새로운 문맥에서 20개 단어 다시 만나기"}
   </small>
   <div style="margin-top:10px">
    ${state.review.completed?
      '<span class="tag">✅ 완료</span>':
      '<button class="btn pink" onclick="startReview()">🎮 시작 / 이어하기</button>'}
   </div>
  </div>`;

 const cards=schedule.map((s,i)=>{
  const d=state.delayed[i];
  const left=daysUntil(s.day);
  const previousDone=i===0||state.delayed[i-1].completed;
  const ready=left===0&&state.review.completed&&previousDone;

  let info="";
  let action="";

  if(d.completed){
   info=`완료 · 첫 시도 성공 ${d.score}/20`;
   action='<span class="tag">✅ 완료</span>';
  }else if(!state.review.completed){
   info="먼저 Day 0 종합 모험을 완료해 줘.";
   action='<span class="tag">🔒 잠김</span>';
  }else if(!previousDone){
   info="이전 복귀 퀘스트를 먼저 완료해 줘.";
   action='<span class="tag">🔒 잠김</span>';
  }else if(left>0){
   info=`${left}일 후 열려요.`;
   action='<span class="tag">⏳ 기다리는 중</span>';
  }else{
   info=`준비 완료! ${d.cursor}/20 진행`;
   action=`<button class="btn mint" onclick="startDelayed(${i})">
    🎮 시작 / 이어하기
   </button>`;
  }

  return `
   <div class="timecard ${d.completed?"done":ready?"open":""}">
    <strong>${s.icon} ${s.title} · ${s.desc}</strong>
    <small>${info}</small>
    <div style="margin-top:10px">${action}</div>
   </div>`;
 }).join("");

 const allDone=state.delayed.every(d=>d.completed);

 render(`
  <div class="center">
   <div class="tag">SPACED PRACTICE</div>
   <div class="mascot">🕒🪄</div>
   <h1>마법 복습 시계</h1>
   <p class="subtitle">
    같은 단어를 다른 날, 다른 이야기에서 만나자!
   </p>
  </div>
  <div class="timeline">
   ${day0}
   ${cards}
  </div>
  <div class="notice">
   📅 첫 탐험 완료일:
   ${new Date(state.completedAt).toLocaleDateString("ko-KR")}<br>
   오늘은 첫 탐험으로부터 ${daysPassed()}일째야.<br>
   복습 일정은 기기의 날짜를 기준으로 열려.
  </div>
  ${allDone?`
   <div class="center">
    <div class="reward">🏆🎓🌈</div>
    <h2>모든 분산 복습 완료!</h2>
   </div>`:""}
  <div class="center">
   <button class="btn light" onclick="home()">🏠 월드맵</button>
  </div>
 `);
}

function resetGame(){
 if(!confirm("별, 보석, 학습 진행 기록을 모두 초기화할까요?"))return;
 stopVoice();
 state=fresh();
 task=null;
 activeDelayed=-1;
 save();
 home();
}

/* 앱 시작 */
home();
</script>
</body>
</html>
